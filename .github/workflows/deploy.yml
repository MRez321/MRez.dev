name: Deploy Next.js to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

      - name: Move Static Assets & Prepare Restart File
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          mkdir -p .next/standalone/tmp
          touch .next/standalone/tmp/restart.txt

      - name: Sync via FTP to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: .next/standalone/
          server-dir: ${{ secrets.REMOTE_PATH }}/
          dangerous-clean-slate: false
